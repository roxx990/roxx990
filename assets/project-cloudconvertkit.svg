<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 428 384" width="428" height="384" role="img" aria-label="CloudConvertKit: the whole CloudConvert lifecycle, from staging the input to saving the output.">
  <style>
    .wt { font: 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #8C92A6 }
    .name { font: 700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #E8EAF2 }
    .kind { font: 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #8C92A6 }
    .desc { font: 14.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #C3C7D6 }
    .tag { font: 600 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #C4B5FD }
    .go { font: 600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #C4B5FD }
    .lang { font: 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #8C92A6 }
    .mono { font: 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #8C92A6 }
    .glow { animation: glow 3.2s ease-in-out infinite }
    @keyframes glow { 50% { opacity: .35 } }
    .ext { font: 700 9.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #fff; letter-spacing: .5px }
    .flow { animation: flow 1s linear infinite }
    @keyframes flow { to { stroke-dashoffset: -20 } }
    .ring { animation: ring 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center }
    @keyframes ring { from { transform: scale(.8); opacity: 1 } to { transform: scale(1.25); opacity: 0 } }
    .out { animation: out 2.4s ease-in-out infinite }
    @keyframes out { 0%,40% { opacity: .35 } 60%,100% { opacity: 1 } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366F1" stop-opacity="0"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".07"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <g transform="translate(8 0)"><rect x=".5" y=".5" width="411" height="383" rx="16" fill="#11131C" stroke="#262A38"/><circle cx="20" cy="18" r="5" fill="#363B4D"/><circle cx="36" cy="18" r="5" fill="#363B4D"/><circle cx="52" cy="18" r="5" fill="#363B4D"/><text x="206.0" y="22" text-anchor="middle" class="wt">Package.swift</text><path d="M1 36.5H411" stroke="#262A38"/><path d="M60 36.5H352" stroke="url(#edge)"/><rect x="16" y="50" width="380" height="132" rx="12" fill="#0C0E16"/><rect x="16" y="50" width="380" height="132" rx="12" fill="url(#dots)" stroke="#262A38"/><g transform="translate(4.0 0)">
    <g ><path d="M56 82h28l12 12v40a3 3 0 0 1-3 3h-34a3 3 0 0 1-3-3v-49a3 3 0 0 1 3-3z" fill="#1C1F2E" stroke="#fff" stroke-opacity=".22"/><path d="M84 82v9a3 3 0 0 0 3 3h9" fill="none" stroke="#fff" stroke-opacity=".22"/><rect x="59" y="114" width="34" height="15" rx="4" fill="url(#g)"/><text x="76" y="125" text-anchor="middle" class="ext">MOV</text></g>
    <path class="flow" d="M110 108H160" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
    <circle class="ring" cx="202" cy="108" r="38" fill="none" stroke="#C4B5FD" stroke-opacity=".5"/>
    <circle cx="202" cy="108" r="30" fill="url(#g)"/>
    <g transform="translate(180 86)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 31h15.5a6 6 0 0 0 .6-11.97A8.5 8.5 0 0 0 14.2 21.4 4.8 4.8 0 0 0 14.5 31z"/><path class="spin" d="M17 24.5a5 5 0 0 1 9-2.5m1 4.5a5 5 0 0 1-9 2.5"/></g>
    <path class="flow" d="M244 108H294" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
    <g class="out"><path d="M308 82h28l12 12v40a3 3 0 0 1-3 3h-34a3 3 0 0 1-3-3v-49a3 3 0 0 1 3-3z" fill="#1C1F2E" stroke="#fff" stroke-opacity=".22"/><path d="M336 82v9a3 3 0 0 0 3 3h9" fill="none" stroke="#fff" stroke-opacity=".22"/><rect x="311" y="114" width="34" height="15" rx="4" fill="url(#g)"/><text x="328" y="125" text-anchor="middle" class="ext">MP4</text></g>
    <text x="76" y="166" text-anchor="middle" class="mono">stage</text>
    <text x="202" y="166" text-anchor="middle" class="mono">convert</text>
    <text x="328" y="166" text-anchor="middle" class="mono">save</text></g><rect class="glow" x="24" y="202" width="44" height="44" rx="11.88" fill="url(#g)" filter="url(#soft)" opacity=".7"/><rect x="24" y="202" width="44" height="44" rx="11.88" fill="url(#g)"/><g transform="translate(24 202) scale(1.000)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 31h15.5a6 6 0 0 0 .6-11.97A8.5 8.5 0 0 0 14.2 21.4 4.8 4.8 0 0 0 14.5 31z"/></g><text x="80" y="222" class="name" style="font-size:19px">CloudConvertKit</text><text x="80" y="242" class="kind">Swift package</text><text x="24" y="284" class="desc" style="font-size:14px">The whole CloudConvert lifecycle, from staging</text><text x="24" y="307" class="desc" style="font-size:14px">the input to saving the output. Zero deps.</text><rect x="24" y="332" width="66.30000000000001" height="24" rx="12" fill="#A855F7" fill-opacity=".12" stroke="#C4B5FD" stroke-opacity=".35"/><text x="57.150000000000006" y="348" text-anchor="middle" class="tag">SwiftPM</text><rect x="97.30000000000001" y="332" width="93.9" height="24" rx="12" fill="#A855F7" fill-opacity=".12" stroke="#C4B5FD" stroke-opacity=".35"/><text x="144.25" y="348" text-anchor="middle" class="tag">async/await</text><rect x="198.20000000000002" y="332" width="87.0" height="24" rx="12" fill="#A855F7" fill-opacity=".12" stroke="#C4B5FD" stroke-opacity=".35"/><text x="241.70000000000002" y="348" text-anchor="middle" class="tag">URLSession</text><text x="388" y="349" text-anchor="end" class="go">View →</text></g>
</svg>
