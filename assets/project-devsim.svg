<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 326" width="856" height="326" role="img" aria-label="devsim: macOS menu bar app. Jump straight into iOS Simulator app containers: open, inspect, reset and uninstall apps, or erase a simulator.">
  <style>
    .wt { font: 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #8C92A6 }
    .name { font: 700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #E8EAF2 }
    .kind { font: 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #8C92A6 }
    .desc { font: 14.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #C3C7D6 }
    .tag { font: 600 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #C4B5FD }
    .go { font: 600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #C4B5FD }
    .lang { font: 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #8C92A6 }
    .mono { font: 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #8C92A6 }
    .glow { animation: glow 3.2s ease-in-out infinite }
    @keyframes glow { 50% { opacity: .35 } }
    .mi { font: 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #fff }
    .mh { font: 600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #fff }
    .mm { font: 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #8C92A6 }
    .mb { font: 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #fff }
    .hl { animation: hl 6s ease-in-out infinite }
    @keyframes hl { 0%,20% { transform: translateY(0) } 25%,45% { transform: translateY(26px) } 50%,70% { transform: translateY(52px) } 75%,95% { transform: translateY(78px) } 100% { transform: translateY(0) } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366F1" stop-opacity="0"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".07"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <g transform="translate(8 0)"><defs><linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E1B4B"/><stop offset="1" stop-color="#3B0764"/></linearGradient><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="35"/></filter></defs><rect x=".5" y=".5" width="839" height="315" rx="16" fill="#11131C" stroke="#262A38"/><circle cx="20" cy="18" r="5" fill="#363B4D"/><circle cx="36" cy="18" r="5" fill="#363B4D"/><circle cx="52" cy="18" r="5" fill="#363B4D"/><text x="420.0" y="22" text-anchor="middle" class="wt">devsim.app</text><path d="M1 36.5H839" stroke="#262A38"/><path d="M60 36.5H780" stroke="url(#edge)"/><rect class="glow" x="28" y="60" width="52" height="52" rx="14.040000000000001" fill="url(#g)" filter="url(#soft)" opacity=".7"/><rect x="28" y="60" width="52" height="52" rx="14.040000000000001" fill="url(#g)"/><g transform="translate(28 60) scale(1.182)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="9" width="14" height="26" rx="3.5"/><path d="M20 12.5h4"/><circle cx="22" cy="30.5" r="1" fill="#fff"/></g><text x="96" y="84" class="name">devsim</text><text x="96" y="105" class="kind">macOS menu bar app</text><text x="28" y="152" class="desc">Jump straight into iOS Simulator app</text><text x="28" y="177" class="desc">containers: open, inspect, reset and</text><text x="28" y="202" class="desc">uninstall apps, or erase a simulator.</text><rect x="28" y="236" width="52.5" height="24" rx="12" fill="#A855F7" fill-opacity=".12" stroke="#C4B5FD" stroke-opacity=".35"/><text x="54.25" y="252" text-anchor="middle" class="tag">macOS</text><rect x="87.5" y="236" width="73.2" height="24" rx="12" fill="#A855F7" fill-opacity=".12" stroke="#C4B5FD" stroke-opacity=".35"/><text x="124.1" y="252" text-anchor="middle" class="tag">Menu bar</text><rect x="167.7" y="236" width="80.1" height="24" rx="12" fill="#A855F7" fill-opacity=".12" stroke="#C4B5FD" stroke-opacity=".35"/><text x="207.75" y="252" text-anchor="middle" class="tag">Simulator</text><circle cx="34" cy="286" r="5" fill="#8B5CF6"/><text x="46" y="290" class="lang">Swift</text><text x="396" y="290" text-anchor="end" class="go">View on GitHub →</text>
    <clipPath id="desk"><rect x="432" y="52" width="384" height="240" rx="12"/></clipPath>
    <g clip-path="url(#desk)">
      <rect x="432" y="52" width="384" height="240" fill="url(#wall)"/>
      <circle cx="492" cy="252" r="90" fill="#6366F1" opacity=".5" filter="url(#blur)"/>
      <circle cx="762" cy="92" r="90" fill="#A855F7" opacity=".45" filter="url(#blur)"/>
      <rect x="432" y="52" width="384" height="26" fill="#000" fill-opacity=".3"/>
      <rect x="592" y="55" width="24" height="20" rx="5" fill="#fff" fill-opacity=".22"/>
      <g transform="translate(592 53) scale(.55)" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><rect x="15" y="9" width="14" height="26" rx="3.5"/><path d="M20 12.5h4"/><circle cx="22" cy="30.5" r="1" fill="#fff"/></g>
      <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".9">
        <path d="M720 64.5a7 7 0 0 1 9.6 0M722.2 67.2a3.8 3.8 0 0 1 5.2 0"/>
