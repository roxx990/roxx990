      </g>
      <rect x="740" y="62.5" width="12" height="5" rx="1.3" fill="#fff"/>
      <text x="802" y="69.5" text-anchor="end" class="mb">9:41</text>
      
      <g filter="url(#shadow)"><rect x="588" y="84" width="214" height="190" rx="10" fill="#1A1C29" fill-opacity=".96" stroke="#fff" stroke-opacity=".12"/></g>
      <circle cx="606" cy="105" r="4" fill="#C4B5FD"/>
      <text x="618" y="109" class="mh">iPhone 16 Pro</text>
      <text x="788" y="109" text-anchor="end" class="mm">Booted</text>
      <path d="M598 122.5H792" stroke="#fff" stroke-opacity=".1"/>
      <rect class="hl" x="594" y="130" width="202" height="24" rx="6" fill="url(#g)"/>
      <text x="604" y="147" class="mi">Open App Container</text><text x="604" y="173" class="mi">Inspect Data</text><text x="604" y="199" class="mi">Reset App</text><text x="604" y="225" class="mi">Uninstall App</text>
      <path d="M598 240.5H792" stroke="#fff" stroke-opacity=".1"/>
      <text x="604" y="262" class="mi" fill-opacity=".6">Erase Simulator…</text>
    </g></g>
</svg>
